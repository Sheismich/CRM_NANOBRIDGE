<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM NANOBRIDGE</title>
    <!-- Fuentes (Anton, Montserrat, Manrope): aquí y no con @import en
         index.css, para que se pidan en paralelo con el CSS y no después.
         La CSP de firebase.json ya permite fonts.googleapis.com y fonts.gstatic.com. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" />
    <!-- Herramienta interna: que los buscadores no la muestren (firebase.json
         manda además X-Robots-Tag). Sin robots.txt con Disallow a propósito:
         si el buscador no puede entrar, tampoco ve este noindex. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Vista previa al compartir el link (WhatsApp, correo). -->
    <meta property="og:title" content="CRM NANOBRIDGE" />
    <meta property="og:description" content="CRM interno de prospección de NANOBRIDGE." />
    <meta property="og:image" content="https://crm-prospeccion-outbound.web.app/logo-nanobridge.png" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
