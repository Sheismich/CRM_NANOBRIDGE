<!doctype html>
<!--
  Página que ve el prospecto al darse de baja con el link del pie del correo.
  Se pega en SendGrid → Settings → Tracking → Subscription Tracking →
  Landing Page (HTML propio), en la cuenta DEFINITIVA de SendGrid
  (RUNBOOK_DEPLOY.md §10). El Status de esa pantalla se queda APAGADO: si se
  prende, SendGrid pega su pie a todos los correos (doble pie en los
  nuestros y pie en los avisos de B4 y PT2). Nuestro pie se enciende correo
  por correo desde PT1b.
  Cuando Carlos pase un correo real de la empresa, agregarlo al último
  párrafo (hola@contacto… no tiene bandeja).
-->
