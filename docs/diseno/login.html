<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login NANOBRIDGE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif}
input.sel{position:absolute;opacity:0;pointer-events:none}
.pg{--bg:#eef1f9;--trace:#d5dbea;--node:#eef1f9;--nodeb:#c3cbe0;--card:#fff;--bd:#e4e8f2;--field:#f6f8fd;--tx:#151c36;--strong:#101733;--tx3:#8992ad;--link:#2a449b;--sh:0 1px 0 #e4e8f2,0 30px 70px -25px rgba(16,23,51,.25);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;position:relative;overflow:hidden;background:var(--bg)}
#td:checked~.pg{--bg:#0a0f1e;--trace:#1a2340;--node:#0a0f1e;--nodeb:#2b3660;--card:#121a32;--bd:#222c4d;--field:#0f1629;--tx:#dfe5f7;--strong:#fff;--tx3:#7b84a5;--link:#93a9ff;--sh:0 0 0 1px rgba(35,186,211,.06),0 30px 80px -25px rgba(0,0,0,.8)}
svg.bg{position:absolute;inset:0;width:100%;height:100%}
.trace{fill:none;stroke:var(--trace);stroke-width:2}
.pulse{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 1400;animation:run 6s linear infinite}
#td:checked~.pg .pulse{filter:drop-shadow(0 0 6px currentColor)}
.pulse.b{animation-duration:8s;animation-delay:-2s}.pulse.c{animation-duration:7s;animation-delay:-4s}.pulse.d{animation-duration:9s;animation-delay:-1s}
@keyframes run{from{stroke-dashoffset:1460}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
.node{fill:var(--node);stroke:var(--nodeb);stroke-width:2}
.bg.mob{display:none}
.card{position:relative;z-index:2;width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:36px 34px 28px;box-shadow:var(--sh)}
.card::before{content:"";position:absolute;left:24px;right:24px;top:0;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#41e198,#23bad3,#2a449b,#5b2d86)}
.top{display:flex;align-items:center;gap:12px}
.top img{width:42px}
.lgd{display:none}#td:checked~.pg .lgd{display:block}#td:checked~.pg .lgl{display:none}
.top b{display:block;font-family:Anton;font-weight:400;font-size:19px;letter-spacing:1.5px;color:var(--strong);line-height:1}
.top span{font:700 9px Montserrat;letter-spacing:2px;color:var(--tx3);text-transform:uppercase}
h1{font:800 22px Montserrat;color:var(--strong);margin-top:28px}
.fld{margin-top:16px}.fld:first-of-type{margin-top:20px}
label.t{display:block;font-weight:700;font-size:13px;color:var(--tx);margin-bottom:7px}
input.in{width:100%;height:48px;border:1.5px solid var(--bd);border-radius:12px;background:var(--field);padding:0 14px;font:500 15px Manrope;color:var(--strong);outline:none}
input.in::placeholder{color:var(--tx3)}
input.in:focus{border-color:#23bad3;background:var(--card);box-shadow:0 0 0 4px rgba(35,186,211,.14)}
button.go{margin-top:24px;width:100%;height:50px;border:0;border-radius:12px;color:#fff;font:800 15px Manrope;background:linear-gradient(120deg,#2a449b,#5b2d86);cursor:pointer;box-shadow:0 10px 24px -10px rgba(42,68,155,.7)}
.help{margin-top:16px;text-align:center;font-size:13px;color:var(--tx3)}.help a{color:var(--link);font-weight:700;text-decoration:none}
.theme{position:absolute;right:16px;top:16px;z-index:3;display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px}
.theme label{width:32px;height:28px;border-radius:99px;display:grid;place-items:center;cursor:pointer;color:var(--tx3)}
.theme svg{width:15px;height:15px}
#tl:checked~.pg .theme label[for=tl],#td:checked~.pg .theme label[for=td]{background:var(--field);color:var(--strong)}
.foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;font:700 10px Montserrat;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;z-index:2}
@media (max-width:760px){
  .bg.desk{display:none}.bg.mob{display:block}
  .card{padding:30px 22px 24px}
}
</style>
</head>
