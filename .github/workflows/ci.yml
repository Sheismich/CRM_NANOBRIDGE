# Pruebas en cada push a main y en cada pull request (4-nov-2026).
# La API corre contra un MySQL 8.0 de servicio, igual que el MySQL desechable
# de las pruebas locales: root sin contraseña y en UTC (el contenedor y el
# runner ya vienen en UTC; con la hora de México fallan pruebas de fechas).
# La base se llama nanobridge_test porque global-setup.ts solo acepta bases
# con "test" en el nombre: la borra y la recrea en cada corrida.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: el repo es público y un pull request de fuera también dispara
# este workflow. Las pruebas no necesitan escribir nada ni usan secretos.
permissions:
  contents: read

jobs:
  api:
    name: API · lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: nanobridge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://root@127.0.0.1:3306/nanobridge_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test

  front:
    name: Front · lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
